name: Vibemis CI & Releases

# This workflow handles development builds with intelligent build skipping (rules cleaned
# up 2026-07-21, BL-2270 — deterministic, content-based, merge-method-agnostic):
# - test** branches: ANY push whose DIFF vs vibemis-main contains meaningful (non-docs)
#   changes builds a 🔬 alpha pre-release. The branch name IS the intent — no [alpha]
#   marker commit is required (the old marker + per-commit gate skipped empty marker
#   commits and forced cherry-pick dances). An empty/no-op branch is skipped.
# - vibemis-main: ANY push that changes non-docs paths publishes a 🧪 beta — merge commit,
#   squash merge, rebase merge, and direct push all count identically. The decision is by
#   CONTENT (what the push changed), never by whether HEAD is a merge commit (the old
#   HEAD-is-a-merge-commit rule silently skipped every squash merge). Docs/config-only
#   pushes (.md/.txt/non-workflow .yml) do NOT build — the quiet fast path stays.
# - release/** / main / master / workflow_dispatch: ALWAYS build + create production releases
#
# Beta policy = "a beta tracks every meaningful change landing on vibemis-main, regardless
# of merge method." Release builds on vibemis-main are NEVER concurrency-cancelled (they
# queue — see the concurrency block); only test** alpha builds may be superseded.
# Releases are PERMANENT: every cut stays on the Releases page forever, like tags —
# SemVer §3 released-version immutability. Superseded releases are never deleted.

on:
  push:
    branches:
      # Keep this list TIGHT to avoid noisy builds/releases. Only:
      #  - vibemis-main : integration branch → 🧪 beta (latest)
      #  - test**       : test cycle branches → 🔬 alpha (pre-release, for test-cycle validation)
      #  - release/**   : explicit stable ship → ✅ release
      #  - main/master  : stable
      # fix/**, feat/**, hotfix/**, chore/**, develop, etc. intentionally do NOT build
      # (they produced the old noisy alpha/dev/hotfix prereleases).
      - main
      - master
      - vibemis-main
      - 'test**'
      - 'release/**'
  pull_request:
    branches:
      - vibemis-main
  workflow_dispatch:
    inputs:
      release_type:
        description: '"stable" = production release (bare semver, Latest); "rc" = release candidate of the next stable (<next>-rc.NNN, prerelease)'
        required: false
        type: choice
        options: ['', 'stable', 'rc']
        default: ''
      version_override:
        description: 'Stable cuts only: exact version for a hotfix patch (e.g. 0.5.1). Leave empty for the version.txt next-stable.'
        required: false
        type: string
        default: ''
      stable_confirm:
        description: 'Stable cuts only: type CONFIRM-STABLE to approve this production release. Maintainer approval gate — a stable dispatch without it FAILS before anything builds.'
        required: false
        type: string
        default: ''
      dry_run:
        description: 'Validate-only: build + verify the full pipeline but create NO release and NO tag. Use this to test CI/workflow changes — a version is minted only when a release is actually intended.'
        required: false
        type: boolean
        default: false

env:
  QT_VERSION: '6.8.3'

# Concurrency policy (BL-2270): release builds must never be killed mid-flight.
# - vibemis-main / main / master / release/** pushes and ALL manual dispatches QUEUE:
#   cancel-in-progress is FALSE for them, so an in-flight release build survives any
#   follow-up push (the old blanket cancel-in-progress silently destroyed the #245 and
#   #249 beta builds). GitHub keeps at most one PENDING run per group; if a queued run
#   is superseded by an even newer push, the newer HEAD contains the superseded commits,
#   so its beta (and the same-tier changelog anchoring) still covers them.
# - test** pushes keep cancel-in-progress: a newer alpha supersedes an older in-flight
#   one — losing the older alpha is the desired behavior there.
# The group must NOT include github.event_name: a workflow_dispatch and a push on
# the SAME ref were landing in different groups and running concurrently, so two
# release-producing runs computed the same next beta/alpha counter (counter is read
# in setup-version ~5 min before the tag is created) and collided at publish time —
# one published, the other failed at Create Development Release (BL-2457). Keying the
# group on the ref alone makes push+dispatch on a ref serialize (queue), so the later
# run recomputes the counter after the earlier tag exists. cancel-in-progress still
# only supersedes test** alpha pushes; vibemis-main release builds always queue.
concurrency:
  group: dev-build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' && startsWith(github.ref_name, 'test') }}

jobs:
  # ALL fast, grep-based semantic regression guards run here, in ONE job on ONE
  # runner. Each check script is <1s; the cost was never the checks, it was
  # spinning up a fresh runner (checkout + teardown) per guard. This job globs
  # scripts/check-*-invariants.sh, so ADDING A GUARD IS ZERO WORKFLOW CHANGE —
  # drop a new check-<x>-invariants.sh and it runs automatically. It runs every
  # guard (not fail-fast) so all failures surface at once. It gates both the merge
  # (required status check) and the release (create-dev-release lists it in needs),
  # so a red guard blocks publishing (BL-2459). Do NOT weaken any guard without the
  # on-device evidence its own header documents. Guards covered today: audio
  # no-crackle (BL-2213), RFI default (BL-2408), auto-updater channel/no-GitHub
  # (BL-2437/2438/2439), Quick Menu wiring (BL-2443), release pipeline (BL-2457/2461).
  invariants:
    name: Invariants
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Run all invariant guards
        run: |
          set -u
          shopt -s nullglob
          rc=0
          found=0
          for s in scripts/check-*-invariants.sh; do
            found=1
            echo "::group::$s"
            bash "$s" || rc=1
            echo "::endgroup::"
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::No scripts/check-*-invariants.sh found — the guard set vanished."
            exit 1
          fi
          [ "$rc" -eq 0 ] && echo "All invariant guards passed."
          exit $rc

  # ── The VRR regression suite, which until now CI never built or ran ───────────────
  #
  # tests/vrr holds six binaries covering the timing controller, the rate policy, the
  # refresh guard, the Gamescope swapchain-depth policy and the pacing worker — the
  # exact code paths behind every VRR regression this project has shipped (beta.013
  # through beta.017 were almost entirely VRR fixes). Not one line of it was executed
  # by any job: `grep -rn tests .github/workflows/` returned nothing. The suite was
  # dead weight, passing locally on whichever machine last remembered to run it.
  #
  # It gates the release the same way `invariants` does (create-dev-release lists it in
  # `needs`), so a red test blocks the publish and not merely the merge — a dispatch or
  # a direct push never goes through a PR, so a merge-only gate would not cover a cut.
  #
  # System Qt 6 (Ubuntu's qt6-base-dev, currently 6.4.2) rather than the
  # install-qt-action the compile jobs use: these are console programs with no GUI, no
  # QML scenegraph and no multimedia, so the ~2 minutes of aqt download buys nothing.
  # 6.4.2 is also the version the suite is verified against on the dev box.
  vrr-tests:
    name: VRR Tests
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          # REQUIRED, not defensive: pacingworker.pro puts
          # moonlight-common-c/moonlight-common-c/src on the include path and
          # vrrpacingworker.cpp does `#include <Limelight.h>`, which exists ONLY in that
          # submodule (verified: it is the single copy in the tree). Without this the
          # build dies on the last of the six targets and the job never runs a test.
          submodules: 'recursive'
          fetch-depth: 1

      # Same mitigation as the compile jobs: azure.archive.ubuntu.com stalls for tens
      # of seconds per package often enough to dominate a job this short.
      - name: Harden apt against flaky mirrors
        run: |
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' \
            | sudo tee /etc/apt/apt.conf.d/99-vibemis-ci-retries

      - name: Install test dependencies
        run: |
          sudo apt-get update
          # qt6-base-dev-tools provides qmake6; qt6-declarative-dev provides QtQml,
          # which pacingworker.pro needs (QT += core qml). libavutil/libsdl2 are
          # pulled in through pkg-config by the timing and pacing tests.
          sudo apt-get install -y \
            build-essential pkg-config \
            qt6-base-dev qt6-base-dev-tools qt6-declarative-dev \
            libavutil-dev libsdl2-dev

      # tests/tests.pro is opt-in (it only descends into its SUBDIRS when qmake is
      # given CONFIG+=tests), so point qmake straight at tests/vrr/vrr.pro instead —
      # one less flag to forget, and it builds nothing this job does not run.
      - name: Build the VRR test suite
        run: |
          set -Eeuo pipefail
          mkdir -p build-vrr-tests
          cd build-vrr-tests
          qmake6 "$GITHUB_WORKSPACE/tests/vrr/vrr.pro"
          make -j"$(nproc)"

      # Every binary is named explicitly and its absence is a FAILURE. Globbing
      # whatever happens to be executable would let a target silently drop out of
      # vrr.pro and leave this job green while covering less — which is the exact
      # shape of the problem this job exists to fix.
      #
      # BL-2529 added test_vrrpacingmode (the frame-pacing gate on the VRR path).
      - name: Run the VRR test suite
        run: |
          set -Eeuo pipefail
          cd build-vrr-tests
          # The console tests print nothing on success and communicate purely through
          # their exit status; only the QtTest one (tst_vrrratepolicy) prints PASS lines.
          export QT_QPA_PLATFORM=offscreen
          rc=0
          for t in tst_vrrtimingcontroller tst_vrrratepolicy test_vrrratepolicy \
                   test_vrrrefreshguard test_vrrswapchainpolicy test_vrrpacingmode \
                   tst_vrrpacingworker; do
            # Searched from the workspace root, not the build dir: a subdirs template
            # whose entries carry an absolute .file can emit its targets next to the
            # sources instead of into the shadow tree, and which one happens today is
            # not worth pinning a job on.
            bin=$(find "$GITHUB_WORKSPACE" -type f -name "$t" -perm -u+x -print -quit)
            if [ -z "$bin" ]; then
              echo "::error title=VRR test binary missing::$t was not built — did it drop out of tests/vrr/vrr.pro?"
              rc=1
              continue
            fi
            echo "::group::$t"
            if "$bin"; then
              echo "$t: PASS"
            else
              echo "::error title=VRR test failed::$t exited non-zero"
              rc=1
            fi
            echo "::endgroup::"
          done
          if [ "$rc" -ne 0 ]; then
            echo "- VRR test suite FAILED" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "All seven VRR test binaries passed."
          echo "- VRR test suite: all seven binaries passed" >> "$GITHUB_STEP_SUMMARY"

      # tests/overlay sat in exactly the same hole tests/vrr was just pulled out of:
      # written, passing locally, and built by no job — so its coverage could never
      # fail a build. Found while adding the BL-2417 decoder-status line, whose 18
      # cases would otherwise have been decorative.
      - name: Build the overlay test suite
        run: |
          set -Eeuo pipefail
          mkdir -p build-overlay-tests
          cd build-overlay-tests
          qmake6 "$GITHUB_WORKSPACE/tests/overlay/overlay.pro"
          make -j"$(nproc)"

      - name: Run the overlay test suite
        run: |
          set -Eeuo pipefail
          cd build-overlay-tests
          export QT_QPA_PLATFORM=offscreen
          rc=0
          # Named explicitly for the same reason as the VRR list above: a target
          # dropping out of overlay.pro must fail the job, not silently shrink it.
          for t in tst_decoderstatus tst_overlayplacement; do
            bin=$(find "$GITHUB_WORKSPACE" -type f -name "$t" -perm -u+x -print -quit)
            if [ -z "$bin" ]; then
              echo "::error title=Overlay test binary missing::$t was not built — did it drop out of tests/overlay/overlay.pro?"
              rc=1
              continue
            fi
            echo "::group::$t"
            if "$bin"; then
              echo "$t: PASS"
            else
              echo "::error title=Overlay test failed::$t exited non-zero"
              rc=1
            fi
            echo "::endgroup::"
          done
          if [ "$rc" -ne 0 ]; then
            echo "- Overlay test suite FAILED" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "- Overlay test suite: both binaries passed" >> "$GITHUB_STEP_SUMMARY"

  # A change a user can notice must ship with a sentence a user can read.
  #
  # The release body's "🎯 What's new for you" section is built EXCLUSIVELY from
  # `Changelog:` lines written by a human -- it never falls back to commit subjects,
  # because a commit subject is written for other developers and reads like one. That
  # design only yields good release notes if the notes actually get written, and for
  # months they did not: the section was pasted onto individual releases by hand with
  # `gh release edit`, so it vanished again on the very next cut. This check is what
  # turns "the generator CAN render prose" into "the release notes ARE prose", asked at
  # the one moment someone is still in a position to write it.
  #
  # It only fires when the PR actually changes shipping files, so CI/docs/guard PRs are
  # unaffected. Deliberately NOT in the branch-protection required contexts: it should
  # be a loud red X, not something that can wedge a merge if it ever misfires.
  changelog-note:
    name: Changelog note
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Require a user-facing release note
        # Title and body go through the environment, never string-interpolated into
        # the script: they are attacker-controlled text on a fork PR.
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/check-pr-changelog-note.sh "$BASE_SHA" "$HEAD_SHA"

  # ── BL-2460: a merge subject must never be able to suppress the beta ──────────────
  #
  # GitHub skips the `push` and `pull_request` EVENTS entirely when the head commit
  # message contains [skip ci] / [ci skip] / [no ci] / [skip actions] / [actions skip],
  # or a `skip-checks: true` trailer. The workflow never starts, so no beta is cut and
  # the code ships with zero soak. It has already happened four times on vibemis-main:
  # 970cfb94 (#272 — a Quick Menu rendering fix that went straight into stable 0.4.2
  # with no beta at all), f2fb187b (#274), 02fff5aa (#275) and 80b2e731 (#276).
  #
  # This job is the only place the marker can actually be caught, and it splits the
  # problem in two because the two halves have different levers:
  #
  #   pull_request → REJECT. `gh pr merge --squash` defaults the merge subject to the
  #     PR TITLE, which is exactly where all four incidents got their marker, and a PR
  #     title is not a commit message so GitHub's native skip does not see it. Failing
  #     here is the one moment the marker can still be removed. (If a marker is in the
  #     PR's head COMMIT instead, GitHub suppresses the pull_request event, this job
  #     never runs, and — per GitHub's own docs — the required checks stay "Pending",
  #     which blocks the merge. Add "Skip-CI Guard" to the required contexts on
  #     vibemis-main and that hole is closed structurally too.)
  #
  #   push → AUDIT. The merge subject is typed at merge time, so a maintainer can still
  #     paste a marker into the squash title after this check has passed; that push is
  #     then dropped before any workflow exists to notice. Nothing can run during the
  #     skipped event, so this looks BACKWARDS instead: the next push that does run
  #     inspects every commit since the last release tag — a superset of its own range,
  #     precisely because the skipped push's commits are missing from event.before..HEAD
  #     — and fails loudly naming the commits that cut no build. That turns a silent
  #     omission into a red run. It is deliberately NOT in create-dev-release's `needs`:
  #     the beta that heals the gap still publishes. One red run per incident, and it
  #     cannot repeat, because the next range starts at the tag this cut creates.
  skip-ci-guard:
    name: Skip-CI Guard
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          # Tags + history: the push audit anchors its range on the last release tag.
          fetch-depth: 0

      - name: Reject a merge subject that would skip CI
        if: github.event_name == 'pull_request'
        # The title goes through the environment, never string-interpolated into the
        # script — it is attacker-controlled text on a fork PR.
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          # Every string GitHub honours, matched case-insensitively (a [SKIP CI] is a
          # mistake whether or not the platform would act on it).
          MARKERS='\[(skip ci|ci skip|no ci|skip actions|actions skip)\]'
          fail=0

          if printf '%s' "$PR_TITLE" | grep -qEi "$MARKERS"; then
            echo "::error title=Merge subject would skip the beta::PR title contains a CI-skip marker: $PR_TITLE"
            fail=1
          fi
          # A `skip-checks: true` TRAILER is the other documented form. Anchored at
          # column 0 so prose or a quoted example in a description cannot trip it.
          if printf '%s\n' "$PR_TITLE" | grep -qEi '^skip-checks:[[:space:]]*true[[:space:]]*$'; then
            echo "::error title=Merge subject would skip the beta::PR title contains a skip-checks trailer"
            fail=1
          fi

          # Rebase-merge replays the branch's own commits, and a single-commit squash
          # defaults its subject to that commit's subject — so the commit subjects are
          # candidate merge subjects too. The PR BODY is deliberately NOT scanned: it
          # would flag any PR that documents this very behaviour, and a marker in the
          # head commit is already handled by GitHub leaving the checks Pending.
          BASE=$(git merge-base "$BASE_SHA" "$HEAD_SHA" 2>/dev/null || printf '%s' "$BASE_SHA")
          while IFS= read -r line; do
            if [ -z "$line" ]; then continue; fi
            if printf '%s' "${line#* }" | grep -qEi "$MARKERS"; then
              echo "::error title=Commit subject would skip the beta::$line"
              fail=1
            fi
          done < <(git log --format='%H %s' --no-merges "$BASE..$HEAD_SHA" 2>/dev/null)

          if [ "$fail" -ne 0 ]; then
            cat >&2 <<'EOF'
          FAIL: this PR would merge with a CI-skip marker in the subject.

          GitHub skips the push event for such a commit, so NO WORKFLOW RUNS: no beta is
          cut, the AppImage is never built, the invariant guards never run, and the code
          reaches stable with no soak. That is not a theoretical risk — #272 shipped a
          Quick Menu rendering fix straight into stable 0.4.2 that way.

          Remove [skip ci] / [ci skip] / [no ci] / [skip actions] / [actions skip] (and any
          `skip-checks: true` trailer) from the PR title and from every commit subject,
          then re-run. A docs-only change needs no marker: the build already skips itself
          by CONTENT (see the check-changes step), and that path still records a run.
          EOF
            exit 1
          fi
          echo "OK: no CI-skip marker in the PR title or any commit subject."

      - name: Audit for pushes that silently cut no build
        if: github.event_name == 'push'
        # Through the environment, not ${{ }} inside the script: a `test**`/`release/**`
        # branch name is user-supplied text and would otherwise be pasted into the shell.
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          # set -e is on (GitHub runs `bash -e`), so every conditional below is written as
          # an `if`, never as `cmd && var=...` — a failing grep in an AND-list is fine but
          # the idiom is one edit away from aborting the whole audit silently.
          set -uo pipefail
          MARKERS='\[(skip ci|ci skip|no ci|skip actions|actions skip)\]'

          # Anchor on the closest release tag that is an ANCESTOR of HEAD — i.e. the last
          # commit that actually got a cut. event.before is useless here by construction:
          # a skipped push still advances the ref, so the next push's before..HEAD range
          # excludes exactly the commits that went unbuilt. Bare-semver match only, so an
          # upstream marker tag (v6.1.0-vrr10) can never anchor the range.
          LAST_TAG=$(git describe --tags --abbrev=0 --match '[0-9]*.[0-9]*' HEAD 2>/dev/null || true)
          if [ -n "$LAST_TAG" ]; then
            RANGE="${LAST_TAG}..HEAD"
          elif git rev-parse -q --verify HEAD~50 >/dev/null 2>&1; then
            RANGE="HEAD~50..HEAD"
          else
            RANGE="HEAD"
          fi
          echo "Auditing $RANGE for commits whose subject suppressed their own build."

          # Only code matters. A docs-only commit cuts no beta anyway (the check-changes
          # step decides by content), so a marker on one costs nothing and flagging it
          # would just teach people to ignore this job. Mirrors count_meaningful().
          touches_code() {  # $1 = commit -> 0 if it changes a non-docs path
            local files
            # A root commit has no first parent; treat an unknown diff as code (fail loud).
            files=$(git diff --name-only "$1^1" "$1" 2>/dev/null) || return 0
            if printf '%s\n' "$files" | grep -vE '(\.md|\.txt|\.yml|\.yaml)$' | grep -q .; then
              return 0
            fi
            printf '%s\n' "$files" | grep -qE '^\.github/workflows/.*\.(yml|yaml)$'
          }

          flagged=""
          while IFS= read -r c; do
            if [ -z "$c" ]; then continue; fi
            subj=$(git log -1 --format='%s' "$c")
            hit=""
            if printf '%s' "$subj" | grep -qEi "$MARKERS"; then
              hit="subject marker"
            elif git log -1 --format='%b' "$c" | grep -qEi '^skip-checks:[[:space:]]*true[[:space:]]*$'; then
              hit="skip-checks trailer"
            fi
            if [ -z "$hit" ]; then continue; fi
            if ! touches_code "$c"; then continue; fi
            flagged="${flagged}- \`${c}\` (${hit}): ${subj}"$'\n'
          done < <(git rev-list "$RANGE" 2>/dev/null)

          if [ -z "$flagged" ]; then
            echo "OK: every code commit in $RANGE was able to trigger a run."
            exit 0
          fi

          echo "::error title=A push was silently dropped::code landed on ${REF_NAME} with a CI-skip marker, so it cut no build"
          {
            echo "### ⚠ Commits that suppressed their own build"
            echo
            echo "These landed on \`${REF_NAME}\` since \`${LAST_TAG:-the last 50 commits}\` carrying a"
            echo "CI-skip marker, so GitHub dropped their push event: no build, no guards, no beta."
            echo
            printf '%s\n' "$flagged"
            echo "This cut covers them, so nothing is lost — but they got no beta of their own and no"
            echo "soak. Nothing to clean up: the next audit range starts at the tag this run creates."
          } >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$flagged" >&2
          exit 1

  setup-version:
    name: Setup Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      numeric_version: ${{ steps.version.outputs.numeric_version }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
      release_tier: ${{ steps.version.outputs.release_tier }}
      should_build: ${{ steps.check-changes.outputs.should_build }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # Need full history for proper versioning

      # Post-split content guard: internal-only content (the testing/ cycle
      # directory beyond its stub README, and docs/personas/) must not drift back
      # into this public repository. Runs on vibemis-main pushes (any merge method) so a
      # reintroduction fails fast.
      - name: Post-split content guard
        if: github.ref_name == 'vibemis-main'
        run: |
          fail=0
          if [ -d testing ] && [ -n "$(find testing -type f ! -name README.md)" ]; then
            echo "::error::testing/ contains files other than the stub README.md — this content is not part of the public source tree."
            fail=1
          fi
          if [ -d docs/personas ]; then
            echo "::error::docs/personas/ has reappeared — this content is not part of the public source tree."
            fail=1
          fi
          if [ "$fail" -eq 1 ]; then
            echo "::error::Post-split content guard failed — remove the flagged paths and try again."
            exit 1
          fi
          echo "Post-split guard: OK"

      - name: Check for meaningful changes
        id: check-changes
        run: |
          # ── Release-cut rules (BL-2270, 2026-07-21) — deterministic + content-based ──
          #   beta  : ANY push to vibemis-main whose CONTENT changes non-docs paths.
          #           Merge commit / squash / rebase / direct push all count identically.
          #   alpha : ANY push to a test** branch whose DIFF vs vibemis-main (merge-base)
          #           contains non-docs changes. No [alpha] marker commit — the branch
          #           name IS the intent. Empty/no-op branches are skipped.
          #   docs-only pushes (only .md/.txt/non-workflow .yml/.yaml) never release.

          # Pull requests must emit the two real branch-protection checks. A PR runs
          # from refs/pull/<n>/merge, so it can never satisfy create-dev-release's
          # refs/heads/* guard below and therefore cannot mint a tag or release.
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "Building pull-request validation only (release job is ref-gated)"
            exit 0
          fi

          # Always build on true release branches and workflow_dispatch.
          if [[ "${{ github.ref_name }}" == "main" || \
                "${{ github.ref_name }}" == "master" || \
                "${{ github.ref_name }}" =~ ^release/ || \
                "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "Always building on release branch or workflow_dispatch"
            exit 0
          fi

          # Meaningful = non-docs. Docs/config (.md, .txt, non-workflow .yml/.yaml) don't
          # count; .github/workflows/ files DO (CI changes are releasable behavior).
          count_meaningful() {  # $1 = base commit, $2 = head commit -> count on stdout
            local CODE_FILES WORKFLOW_FILES
            CODE_FILES=$(git diff --name-only "$1" "$2" | grep -v -E "(\.md$|\.txt$|\.yml$|\.yaml$)" | wc -l)
            WORKFLOW_FILES=$(git diff --name-only "$1" "$2" | grep -E "^\.github/workflows/.*\.(yml|yaml)$" | wc -l)
            echo $((CODE_FILES + WORKFLOW_FILES))
          }

          # vibemis-main (beta integration branch): a 🧪 beta is published for ANY push
          # that changes non-docs paths. The decision is by push CONTENT (event.before →
          # HEAD), never by whether HEAD is a merge commit — the old merge-commit rule
          # silently skipped every squash/rebase merge (#243/#244/#246/#247/#248/#251).
          if [[ "${{ github.ref_name }}" == "vibemis-main" || "${{ github.ref_name }}" == "develop" ]]; then
            BASE="${{ github.event.before }}"
            ZERO="0000000000000000000000000000000000000000"
            if [ -z "$BASE" ] || [ "$BASE" = "$ZERO" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
              # Fallback (branch creation / force-push away / unknown before): diff the
              # HEAD commit itself against its first parent.
              BASE=$(git rev-parse HEAD^1 2>/dev/null || echo "")
            fi
            if [ -z "$BASE" ]; then
              echo "should_build=true" >> $GITHUB_OUTPUT
              echo "Building beta — no usable diff base (root commit?); failing open"
              exit 0
            fi
            TOTAL=$(count_meaningful "$BASE" HEAD)
            if [ "$TOTAL" -eq 0 ]; then
              echo "should_build=false" >> $GITHUB_OUTPUT
              echo "Skipping beta — push to vibemis-main changed only docs/config paths (range $BASE..HEAD)"
            else
              echo "should_build=true" >> $GITHUB_OUTPUT
              echo "Building beta — push to vibemis-main changed $TOTAL meaningful file(s) (range $BASE..HEAD)"
            fi
            exit 0
          fi

          # NOTE (BL-2460): there is deliberately NO [skip ci] handling here. GitHub skips the
          # push/pull_request EVENT itself when the head commit carries [skip ci]/[ci skip]/
          # [no ci]/[skip actions]/[actions skip] or a `skip-checks: true` trailer, so the run
          # never starts and an in-YAML guard can never execute — the one that used to sit here
          # was unreachable code that read as protection. The real handling is the `skip-ci-guard`
          # job (PR-time rejection + post-hoc audit of pushes that silently cut no beta).

          # test** (alpha channel): ANY push builds a 🔬 alpha when the branch's diff vs
          # the merge-base with vibemis-main contains meaningful (non-docs) changes.
          # No [alpha] marker commit is required — the old marker + per-commit gate
          # SKIPPED empty marker commits (test137) and forced cherry-pick dances.
          # Diffing vs the merge-base means a cherry-picked or merged test branch always
          # qualifies; an empty/no-op branch (no diff vs vibemis-main) does not.
          if [[ "${{ github.ref_name }}" =~ ^test ]]; then
            git fetch --no-tags origin "+refs/heads/vibemis-main:refs/remotes/origin/vibemis-main" 2>/dev/null || true
            MERGE_BASE=$(git merge-base HEAD origin/vibemis-main 2>/dev/null || echo "")
            if [ -z "$MERGE_BASE" ]; then
              echo "should_build=true" >> $GITHUB_OUTPUT
              echo "Building alpha — no merge-base with vibemis-main; failing open"
              exit 0
            fi
            TOTAL=$(count_meaningful "$MERGE_BASE" HEAD)
            if [ "$TOTAL" -eq 0 ]; then
              echo "should_build=false" >> $GITHUB_OUTPUT
              echo "Skipping alpha — test branch has no meaningful (non-docs) diff vs vibemis-main (merge-base $MERGE_BASE)"
            else
              echo "should_build=true" >> $GITHUB_OUTPUT
              echo "Building alpha — test branch diff vs vibemis-main has $TOTAL meaningful file(s) (merge-base $MERGE_BASE)"
            fi
            exit 0
          fi

          # Unreachable today (the push trigger list is tight), kept as a safe default.
          echo "should_build=true" >> $GITHUB_OUTPUT
          echo "Build will proceed — unmatched ref ${{ github.ref_name }} defaults to build"
      
      # The stable-approval rule (docs/RELEASING.md tier matrix) enforced at the CI layer,
      # not just in prose — a release_type=stable dispatch without the literal confirmation
      # phrase fails HERE, before any version is computed or artifact built. Downstream
      # jobs all `need` this job, so nothing runs. release/**/main/master pushes are the
      # maintainer's own branch-protected actions and are not gated by this input.
      - name: Enforce stable approval gate
        if: github.event.inputs.release_type == 'stable'
        run: |
          if [ "${{ github.event.inputs.stable_confirm }}" != "CONFIRM-STABLE" ]; then
            echo "::error::Stable cut REFUSED: maintainer approval gate."
            echo "::error::A production release requires the dispatch input stable_confirm=CONFIRM-STABLE."
            echo "::error::Stable releases are maintainer-approval-only."
            exit 1
          fi
          echo "Stable approval confirmed (stable_confirm=CONFIRM-STABLE)."

      # rc-before-stable policy (maintainer 2026-07-17): a stable release MUST be promoted from a
      # release candidate. A release_type=stable dispatch FAILS here unless a matching
      # <target>-rc.* tag already exists. Because an rc tag is only ever created by a SUCCESSFUL
      # rc build (Create Development Release runs last), this also proves the candidate built green.
      # Prevents cutting stable straight from a beta and skipping the rc stage.
      - name: Enforce rc-before-stable gate
        if: github.event.inputs.release_type == 'stable'
        run: |
          TARGET="${{ github.event.inputs.version_override }}"
          if [ -z "$TARGET" ]; then
            TARGET=$(cat app/version.txt | tr -d '\n\r')
            # legacy two-segment "W.X" base -> next stable "W.(X+1).0" (mirror Generate semantic version)
            if [[ "$TARGET" =~ ^[0-9]+\.[0-9]+$ ]]; then
              TARGET="$(echo "$TARGET" | cut -d. -f1).$(( $(echo "$TARGET" | cut -d. -f2) + 1 )).0"
            fi
          fi
          # Hotfix/patch exemption (maintainer 2026-07-17): a PATCH release (X.Y.Z with Z>0) is a
          # hotfix and may go straight to stable WITHOUT an rc — hotfixes are urgent and skip the
          # candidate stage. Only minor/major stables (Z==0, i.e. X.Y.0) must be promoted from a
          # preceding rc. (SemVer-aligned: patches are fixes; minors/majors are feature/breaking cuts.)
          PATCH=$(echo "$TARGET" | cut -d. -f3)
          if [ -n "$PATCH" ] && [ "$PATCH" != "0" ]; then
            echo "Patch/hotfix ${TARGET} (patch=${PATCH}) — rc-before-stable not required; proceeding."
            exit 0
          fi
          # Match both the clean (<base>-rc.NNN) and legacy ordinal-first (<base>-nXXXXX-rc.NNN) shapes.
          RC_COUNT=$(git ls-remote --tags origin "refs/tags/${TARGET}-*" 2>/dev/null \
                     | grep -Ec "refs/tags/${TARGET}(-n[0-9]+)?-rc\.[0-9]+\$" || true)
          if [ "${RC_COUNT:-0}" -eq 0 ]; then
            echo "::error::Stable cut REFUSED: no release candidate exists for the minor/major ${TARGET}."
            echo "::error::Policy (rc-before-stable): a minor/major stable must be promoted from a green rc (patches/hotfixes are exempt)."
            echo "::error::Cut one first — dispatch release_type=rc (builds ${TARGET}-rc.NNN), verify it, THEN re-dispatch stable."
            exit 1
          fi
          echo "rc-before-stable satisfied: found ${RC_COUNT} ${TARGET}-rc.* tag(s)."

      - name: Generate semantic version
        id: version
        run: |
          # ── Semantic Versioning 2.0.0 (supersedes the legacy W.X.Y.Z scheme) ──
          # app/version.txt holds the NEXT stable version, e.g. "0.5.0".
          #   stable  → the bare version itself (0.5.0); bump version.txt right after the cut.
          #             A hotfix patch ships via version_override (e.g. 0.5.1).
          #   beta    → 0.5.0-beta.NNN   (dense, zero-padded; NNN = max existing +1)
          #   alpha   → 0.5.0-alpha.NNN  (same counter mechanism)
          #   dev     → 0.5.0-dev.NNN.<branch> (never matches an update channel)
          # Counters scan ls-remote TAGS (pruning deletes releases but keeps tags), so a
          # number is never reused even after cleanup. Zero-padding keeps GitHub's
          # lexical prerelease sort identical to numeric order. The historical catalog
          # (0.1.0-*, …-rc.*, 0.3.1, 0.4.0.0) is documented in docs/RELEASE_HISTORY.md;
          # 0.4.0.0 keeps its four-part tag because deployed devices key on it (≡ 0.4.0).
          BASE_VERSION=$(cat app/version.txt | tr -d '\n\r')
          # Legacy "W.X" bases (two segments) map to the next stable "W.(X+1).0".
          if [[ "$BASE_VERSION" =~ ^[0-9]+\.[0-9]+$ ]]; then
            BASE_VERSION="$(echo "$BASE_VERSION" | cut -d. -f1).$(( $(echo "$BASE_VERSION" | cut -d. -f2) + 1 )).0"
          fi
          next_counter() {  # $1 = suffix class (beta|alpha|rc)
            local tags max
            # ls-remote failure must not silently yield counter 001 — a re-minted
            # <base>-rc.001 would collide with (and effectively overwrite) an
            # already-published release. Print a sentinel the caller can detect
            # (exit here only leaves the $() subshell, so a bare exit is a trap).
            if ! tags=$(git ls-remote --tags origin "refs/tags/${BASE_VERSION}-*" 2>/dev/null); then
              echo "FAIL"
              return
            fi
            # Match BOTH tag shapes — legacy "<base>-beta.NNN" and ordinal-first
            # "<base>-nXXXXX-beta.NNN" — so counters stay dense across the scheme change
            # and a number is never reused.
            max=$(printf '%s\n' "$tags" \
                  | sed -n -E "s#.*refs/tags/${BASE_VERSION}-(n[0-9]+-)?$1\.([0-9]+)\$#\2#p" \
                  | sort -n | tail -1)
            # 10# forces base-10 — zero-padded suffixes are OCTAL to bash arithmetic,
            # so 008 crashed ("value too great for base") and 010+ would silently compute
            # WRONG (lower!) numbers, risking tag reuse. First tripped the day beta.008 existed.
            printf '%03d' $(( 10#${max:-0} + 1 ))
          }
          RUN_N=${GITHUB_RUN_NUMBER}
          # Maintainer decision on release-page ordering: tags stay CLEAN
          # (<base>-<tier>.<CCC>). The ordinal-first experiment (<base>-nNNNNN-<tier>.<CCC>)
          # DID make the GitHub Releases page chronological, but the names were judged too
          # ugly, so we accept the SemVer-precedence page order (alphas list after betas of
          # the same base — spec §11.4; GitHub offers no page sort setting). Chronological
          # views that remain: the build timeline republished to the `releases-index` branch
          # on every cut (RELEASES.md here is a pointer to it), the releases Atom feed, the API,
          # and the in-app channels — all date-ordered. next_counter still scans BOTH tag
          # shapes so history with the one ordinal-era cut can never cause a counter reuse.

          # Get branch info
          BRANCH_NAME="${{ github.ref_name }}"
          BRANCH_SANITIZED=$(echo "$BRANCH_NAME" | sed 's/[^a-zA-Z0-9._-]/-/g')

          # ── Release tier determination (strict semver; <next> = app/version.txt) ──
          # Tier     Trigger                                              Version            Prerelease
          # release  dispatch release_type=stable / release/** / main     <next> (bare)      false (Latest)
          #          ⚠ MAINTAINER-APPROVAL GATE: only the maintainer decides a stable cut;
          #            a stable dispatch requires the CONFIRM-STABLE approval input.
          # rc       dispatch release_type=rc                             <next>-rc.NNN      true
          # beta     any non-docs push to vibemis-main (any merge method)  <next>-beta.NNN    true
          # alpha    test** push with non-docs diff vs vibemis-main        <next>-alpha.NNN   true
          # dev      any other branch                                     <next>-dev.<run>.<branch>  true

          IS_PRERELEASE="true"
          RELEASE_TIER="dev"

          if [[ "${{ github.event.inputs.release_type }}" == "stable" ]]; then
            # ✅ Production release — the bare next-stable version. Bump version.txt to
            # the following stable right after the cut. Hotfix patches via version_override.
            #
            # BL-2458: a bare stable is minted ONLY by an explicit release_type=stable
            # DISPATCH, which is the one path the CONFIRM-STABLE + rc-before-stable gates
            # (steps below, both keyed on release_type=='stable') actually protect. The
            # old condition ALSO tripped on the ref alone (^release/, main, master), so a
            # push to any of those branches produced a bare Latest stable with NO gate — a
            # push event carries no dispatch inputs, so both gates were skipped. Those refs
            # now fall through to the dev tier (channel-invisible prerelease, never Latest),
            # closing the bypass. Dispatch is the only stable door.
            if [[ -n "${{ github.event.inputs.version_override }}" ]]; then
              VERSION="${{ github.event.inputs.version_override }}"
            else
              VERSION="$BASE_VERSION"
            fi
            IS_PRERELEASE="false"
            RELEASE_TIER="release"

          elif [[ "${{ github.event.inputs.release_type }}" == "rc" ]]; then
            # 🎯 Release candidate — the exact build proposed as the next stable, cut for
            # on-device verification. Prerelease-flagged; the updater's RC channel matches
            # the -rc suffix. Never takes Latest.
            VERSION="${BASE_VERSION}-rc.$(next_counter rc)"
            IS_PRERELEASE="true"
            RELEASE_TIER="rc"

          elif [[ "$BRANCH_NAME" == "vibemis-main" || "$BRANCH_NAME" == "develop" ]]; then
            # 🧪 Beta — semver pre-release of the upcoming stable. Prerelease-flagged on
            # GitHub (only bare stables are full releases); the updater's beta channel
            # matches the -beta suffix on every deployed client generation.
            VERSION="${BASE_VERSION}-beta.$(next_counter beta)"
            IS_PRERELEASE="true"
            RELEASE_TIER="beta"

          elif [[ "$BRANCH_NAME" =~ ^test ]]; then
            # 🔬 Alpha — pre-release; the branch is shown in the release body.
            # test** only. fix/feat/hotfix refs (reachable only via manual dispatch)
            # version as dev — the alpha channel consumes test<N> branches exclusively,
            # so a fix-branch "alpha" could never be picked up anyway.
            VERSION="${BASE_VERSION}-alpha.$(next_counter alpha)"
            RELEASE_TIER="alpha"

          else
            # 🔧 Dev — suffixed so channel detection can never match it.
            VERSION="${BASE_VERSION}-dev.${RUN_N}.$BRANCH_SANITIZED"
            RELEASE_TIER="dev"
          fi

          echo "release_tier=$RELEASE_TIER" >> $GITHUB_OUTPUT

          # ── Version-safety gates (audit 2026-07-17, BL-2145 wave) ──
          # 1. A failed/sentinel counter must never mint "<base>-rc." or "-rc.FAIL".
          if [[ "$VERSION" == *-rc. || "$VERSION" == *-beta. || "$VERSION" == *-alpha. || "$VERSION" == *FAIL* ]]; then
            echo "::error::Version counter computation failed (got '$VERSION') — refusing to mint an unsafe tag."
            exit 1
          fi
          # 2. A prerelease of an already-published stable base is always a mistake
          # (semver: 0.3.0-rc.* PRECEDES 0.3.0) — it means app/version.txt wasn't
          # bumped after the stable cut.
          if [[ "$RELEASE_TIER" == "rc" || "$RELEASE_TIER" == "beta" || "$RELEASE_TIER" == "alpha" ]]; then
            if git ls-remote --exit-code origin "refs/tags/${BASE_VERSION}" >/dev/null 2>&1; then
              echo "::error::${BASE_VERSION} is already a published stable — bump app/version.txt to the next version before cutting ${RELEASE_TIER} builds."
              exit 1
            fi
          fi
          # 3. Never re-mint ANY existing tag (releases are immutable, and gh-release
          # would silently attach this build to the old tag's commit).
          if git ls-remote --exit-code origin "refs/tags/${VERSION}" >/dev/null 2>&1; then
            echo "::error::Tag ${VERSION} already exists — refusing to re-mint a published version."
            exit 1
          fi

          # Numeric 4-part version for Windows RC files (strip suffix, append run number)
          NUMERIC_BASE=$(echo "$VERSION" | sed -E 's/-.*$//')
          case "$RELEASE_TIER" in
            release) NUMERIC_VERSION="${NUMERIC_BASE}.0" ;;
            *)       NUMERIC_VERSION="${NUMERIC_BASE}.$RUN_N" ;;
          esac

          # Output all versions
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "numeric_version=$NUMERIC_VERSION" >> $GITHUB_OUTPUT
          echo "is_prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT

          echo "Generated versions:"
          echo "  Semantic Version: $VERSION"
          echo "  Numeric Version: $NUMERIC_VERSION"
          echo "  Is Prerelease: $IS_PRERELEASE"
          echo "  Branch: $BRANCH_NAME"

  compile-sanity:
    name: Compile Sanity (Linux)
    needs: setup-version
    # Pushes and pull requests get a real compile. (There was a third arm here for
    # `ci/releases-md-refresh-*` branches, so the release job could dispatch this
    # workflow against its own bot PR and wait for the required checks. That PR dance
    # is gone -- the build timeline is now force-pushed straight to the unprotected
    # `releases-index` branch -- so the exception has nothing left to serve.)
    if: >-
      needs.setup-version.outputs.should_build == 'true' && (
        github.event_name == 'push' ||
        github.event_name == 'pull_request'
      )
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: 'recursive'
          fetch-depth: 0

      # azure.archive.ubuntu.com stalls (20-140s per package) once turned a 9-min
      # build into 37. A 30s inactivity timeout + retries makes apt fail over to the
      # mirrorlist fallback instead of trickling. Must run before Setup Qt 6 — the Qt
      # action apt-installs its own system deps.
      - name: Harden apt against flaky mirrors
        run: |
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' \
            | sudo tee /etc/apt/apt.conf.d/99-vibemis-ci-retries

      - name: Setup Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: 'linux'
          target: 'desktop'
          modules: 'qtmultimedia'
          cache: true

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libegl1-mesa-dev libgl1-mesa-dev \
            libopus-dev libsdl2-dev libsdl2-ttf-dev \
            libssl-dev libavcodec-dev libavformat-dev libavutil-dev libswscale-dev \
            libxkbcommon-dev wayland-protocols libdrm-dev libgbm-dev \
            libplacebo-dev

      - name: Build (qmake + make)
        run: |
          export PATH="$QT_ROOT_DIR/bin:$PATH"
          qmake6 vibemis.pro CONFIG+=release "QMAKE_CXXFLAGS+=-fPIC"
          make -j$(nproc)

  build-linux-dev:
    name: Linux Development Build
    needs: setup-version
    runs-on: ubuntu-22.04
    # Releases ship ONLY the AppImage, so this tarball build ran ~15 min per
    # beta/alpha for an artifact nobody downloads. Stable cuts keep the full matrix.
    if: needs.setup-version.outputs.should_build == 'true' && needs.setup-version.outputs.release_tier == 'release'
    timeout-minutes: 45

    steps:
    - name: Checkout
      uses: actions/checkout@v5
      with:
        submodules: 'recursive'
        fetch-depth: 0

    # Fail over from stalled apt mirrors instead of trickling (see compile-sanity).
    - name: Harden apt against flaky mirrors
      run: |
        printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' \
          | sudo tee /etc/apt/apt.conf.d/99-vibemis-ci-retries

    - name: Display version info
      run: |
        echo "Using semantic version: ${{ needs.setup-version.outputs.version }}"
        echo "Using numeric version: ${{ needs.setup-version.outputs.numeric_version }}"
        echo "Is prerelease: ${{ needs.setup-version.outputs.is_prerelease }}"
    
    - name: Setup Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ env.QT_VERSION }}
        host: 'linux'
        target: 'desktop'
        modules: 'qtmultimedia'
        cache: true

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          libegl1-mesa-dev libgl1-mesa-dev libopus-dev libsdl2-dev \
          libsdl2-ttf-dev libsdl2-ttf-2.0-0 libssl-dev libavcodec-dev libavformat-dev \
          libswscale-dev libva-dev libvdpau-dev libxkbcommon-dev \
          wayland-protocols libdrm-dev nasm libgbm-dev \
          libfreetype6-dev libasound2-dev libdbus-1-dev \
          libgles2-mesa-dev libglu1-mesa-dev libibus-1.0-dev \
          libpulse-dev libudev-dev libx11-dev libxcursor-dev \
          libxext-dev libxi-dev libxinerama-dev libxrandr-dev \
          libxss-dev libxt-dev libxv-dev libxxf86vm-dev \
          libxcb-dri3-dev libx11-xcb-dev libplacebo-dev
    
    - name: Clean any existing build
      run: |
        rm -f .qmake.stash .qmake.cache
        find . -name "Makefile*" -delete
        rm -rf moonlight-common-c/Makefile* moonlight-common-c/.qmake.stash
        rm -rf qmdnsengine/Makefile* qmdnsengine/.qmake.stash 
        rm -rf h264bitstream/Makefile* h264bitstream/.qmake.stash
        rm -rf app/Makefile* app/.qmake.stash
    
    - name: Build
      run: |
        export PATH="$QT_ROOT_DIR/bin:$PATH"
        export QMAKE="$QT_ROOT_DIR/bin/qmake6"
        qmake6 vibemis.pro CONFIG+=release "QMAKE_CXXFLAGS+=-fPIC"
        make -j$(nproc)
    
    
    - name: Create dependency bundle for Linux
      run: |
        echo "=== Creating dependency bundle ==="
        mkdir -p linux-package/lib
        mkdir -p linux-package/bin

        # Copy the main binary
        cp app/vibemis linux-package/bin/

        # Stage the branded app icon so install.sh can register it (BL-2243)
        mkdir -p linux-package/icon
        cp app/res/icons/hicolor/256x256/apps/vibemis.png linux-package/icon/vibemis.png
        
        # Bundle critical shared libraries that may not be available on all systems
        # Include SDL2 main library and SDL2_ttf which are commonly missing
        echo "Bundling SDL2 libraries..."
        ldd app/vibemis | grep -E "(libSDL2-2\.0|libSDL2_ttf|libopus|libssl)" | while read -r line; do
          lib_path=$(echo "$line" | grep -o '/[^[:space:]]*')
          if [ -n "$lib_path" ] && [ -f "$lib_path" ]; then
            lib_name=$(basename "$lib_path")
            echo "Bundling library: $lib_name from $lib_path"
            cp "$lib_path" linux-package/lib/
          fi
        done
        
        # Also explicitly check for and bundle SDL2 main library if not caught above
        if [ ! -f "linux-package/lib/libSDL2-2.0.so.0" ]; then
          echo "Explicitly looking for SDL2 main library..."
          SDL2_LIB=$(find /usr/lib* /lib* -name "libSDL2-2.0.so.0" 2>/dev/null | head -1)
          if [ -n "$SDL2_LIB" ] && [ -f "$SDL2_LIB" ]; then
            echo "Found and bundling SDL2 main library: $SDL2_LIB"
            cp "$SDL2_LIB" linux-package/lib/
          fi
        fi
        
        # Create launch script that sets library path
        cat > linux-package/vibemis << 'EOF'
        #!/bin/bash
        # Vibemis launcher script
        
        # Resolve the actual directory where this script is located
        # This handles symlinks properly (e.g., ~/.local/bin/vibemis -> ~/.local/share/vibemis-desktop/vibemis)
        if [ -L "${BASH_SOURCE[0]}" ]; then
            # Script is a symlink, resolve to actual location
            SCRIPT_DIR="$(cd "$(dirname "$(readlink -f "${BASH_SOURCE[0]}")")" && pwd)"
        else
            # Script is not a symlink, use dirname normally
            SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
        fi
        
        # Set library path and execute binary
        export LD_LIBRARY_PATH="$SCRIPT_DIR/lib:$LD_LIBRARY_PATH"
        exec "$SCRIPT_DIR/bin/vibemis" "$@"
        EOF
        chmod +x linux-package/vibemis
        
        # Create installation script
        cat > linux-package/install.sh << 'EOF'
        #!/bin/bash
        echo "Installing Vibemis..."
        
        # Install to local directory
        INSTALL_DIR="$HOME/.local/share/vibemis-desktop"
        BIN_DIR="$HOME/.local/bin"
        
        mkdir -p "$INSTALL_DIR" "$BIN_DIR"
        
        # Copy all files
        cp -r * "$INSTALL_DIR/"
        
        # Create symlink to launcher
        ln -sf "$INSTALL_DIR/vibemis" "$BIN_DIR/vibemis"
        
        # Install the branded icon into the hicolor theme so Icon=vibemis resolves
        if [ -f icon/vibemis.png ]; then
            mkdir -p "$HOME/.local/share/icons/hicolor/256x256/apps"
            cp -f icon/vibemis.png "$HOME/.local/share/icons/hicolor/256x256/apps/vibemis.png"
        fi

        # Create desktop entry
        mkdir -p "$HOME/.local/share/applications"
        cat > "$HOME/.local/share/applications/vibemis-desktop.desktop" << 'EOD'
        [Desktop Entry]
        Type=Application
        Name=Vibemis
        Comment=Game streaming client
        Exec=vibemis
        Icon=vibemis
        StartupWMClass=com.vibemis.Vibemis
        Categories=Game;Network;
        EOD
        
        echo "Installation complete!"
        echo "You can run 'vibemis' from terminal or find it in your applications menu."
        echo "If 'vibemis' command is not found, add ~/.local/bin to your PATH"
        EOF
        chmod +x linux-package/install.sh
        
        # Copy library info for debugging
        ldd app/vibemis > linux-package/library_dependencies.txt || echo "ldd failed" > linux-package/library_dependencies.txt
        
        echo "=== Linux package contents ==="
        ls -la linux-package/
        ls -la linux-package/lib/
    
    - name: Package Linux Development Build
      env:
        VERSION: ${{ needs.setup-version.outputs.version }}
      run: |
        # Create info file with semantic versioning
        cat > linux-package/build_info.txt << EOF
        Vibemis Development Build (Linux)
        Version: $VERSION
        Numeric Version: ${{ needs.setup-version.outputs.numeric_version }}
        Is Prerelease: ${{ needs.setup-version.outputs.is_prerelease }}
        Branch: ${{ github.ref_name }}
        Commit: ${{ github.sha }}
        Built: $(date -u '+%Y-%m-%d %H:%M:%S UTC')
        
        Installation:
        1. Extract this archive
        2. Run: ./install.sh (installs to ~/.local/)
        3. Or run directly: ./vibemis
        
        Manual dependencies (if needed):
        - SDL2_ttf: sudo apt install libsdl2-ttf-2.0-0
        - OpenSSL: sudo apt install libssl3
        - FFmpeg: sudo apt install libavcodec58 libavformat58
        EOF
        
        # Create README for users
        cat > linux-package/README.md << 'EOF'
        # Vibemis - Linux Build
        
        ## Quick Installation
        
        1. Extract this archive
        2. Run the installer: `./install.sh`
        3. Launch from terminal: `vibemis`
        
        ## Manual Installation
        
        1. Run directly: `./vibemis`
        2. If you get library errors, install missing dependencies:
        
        ```bash
        # Ubuntu/Debian:
        sudo apt update
        sudo apt install libsdl2-ttf-2.0-0 libssl3 libavcodec58 libavformat58
        
        # Fedora/RHEL:
        sudo dnf install SDL2_ttf openssl-libs ffmpeg-libs
        
        # Arch Linux:
        sudo pacman -S sdl2_ttf openssl ffmpeg
        ```
        
        ## Troubleshooting
        
        - If you see "libSDL2_ttf-2.0.so.0: cannot open shared object file":
          - Install SDL2_ttf: `sudo apt install libsdl2-ttf-2.0-0`
        
        - Check library_dependencies.txt for full dependency list
        - Run with debugging: `LD_DEBUG=libs ./vibemis`
        EOF
        
        # Package with semantic version
        tar -czf vibemis-linux-$VERSION.tar.gz -C linux-package .
    - name: Upload Development Artifacts
      uses: actions/upload-artifact@v6
      with:
        name: vibemis-linux-${{ needs.setup-version.outputs.version }}
        path: vibemis-linux-${{ needs.setup-version.outputs.version }}.tar.gz
        retention-days: 30

  build-appimage-dev:
    name: AppImage Build
    needs: setup-version
    runs-on: ubuntu-22.04
    if: needs.setup-version.outputs.should_build == 'true'
    timeout-minutes: 45

    steps:
    - name: Checkout
      uses: actions/checkout@v5
      with:
        submodules: 'recursive'
        fetch-depth: 0

    # Fail over from stalled apt mirrors instead of trickling (see compile-sanity).
    - name: Harden apt against flaky mirrors
      run: |
        printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' \
          | sudo tee /etc/apt/apt.conf.d/99-vibemis-ci-retries

    - name: Setup Qt 6
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ env.QT_VERSION }}
        host: 'linux'
        target: 'desktop'
        modules: 'qtmultimedia'
        cache: true

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          libegl1-mesa-dev libgl1-mesa-dev \
          libopus-dev libsdl2-dev libsdl2-ttf-dev \
          libssl-dev libavcodec-dev libavformat-dev libavutil-dev libswscale-dev \
          libxkbcommon-dev wayland-protocols libdrm-dev libgbm-dev \
          libva-dev \
          libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
          libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
          librsvg2-bin fuse libfuse2 \
          python3-pip ninja-build
        # NOTE: libplacebo-dev is deliberately NOT installed from apt. Jammy ships
        # libplacebo 4.192 (2022, pre-maintenance1), which is the BL-2516 VRR-stutter
        # root cause on the Legion Go S. A modern libplacebo is source-built below
        # (mirroring Nonary v6.1.0-vrr9.1.1) so it is the only one on the pkg-config /
        # linker path and gets bundled into the AppImage.

    - name: Download linuxdeploy + Qt plugin
      run: |
        mkdir -p $HOME/bin
        wget -q -O $HOME/bin/linuxdeploy.AppImage \
          https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
        wget -q -O $HOME/bin/linuxdeploy-plugin-qt.AppImage \
          https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
        chmod +x $HOME/bin/linuxdeploy.AppImage $HOME/bin/linuxdeploy-plugin-qt.AppImage
        echo "$HOME/bin" >> $GITHUB_PATH

    # BL-2516 — VRR ~1 Hz stutter fix (root cause: stale bundled libplacebo).
    # See vibemis-agent-meta docs/engineering/claude_vrr_rca2.md. On the Legion Go S
    # the active VRR presenter is PlVkRenderer (libplacebo/Vulkan), presenting FIFO
    # depth-1 through gamescope's FROG WSI layer, which force-enables
    # VK_EXT_swapchain_maintenance1. The jammy apt libplacebo 4.192 (2022) predates
    # maintenance1: on any transient VK_SUBOPTIMAL_KHR the layer raises, it destroys
    # and recreates the whole swapchain — a blocking hitch that lands as visible
    # judder while the pacer still submits on schedule (so every submit-side VRR
    # counter stays clean; the defect is invisible to them). Modern haasn libplacebo
    # is maintenance1-cooperative. We source-build the EXACT pin Nonary ships and
    # apply the same crash-guard patch, so the AppImage present path == Nonary's.
    # This holds SDL, FFmpeg and all client source constant — a single-variable
    # change, so an on-device A/B cleanly confirms or refutes the runtime-stack cause.
    - name: Build modern libplacebo (BL-2516 VRR present-path fix)
      run: |
        set -euxo pipefail
        # Modern Vulkan headers (>= 1.3.246 for VK_EXT_swapchain_maintenance1) + a
        # GLSL compiler (glslang/shaderc). Jammy apt vulkan-headers are 1.3.204 and
        # predate maintenance1, so the LunarG SDK is required (same as Nonary).
        wget -qO - https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo apt-key add -
        sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-1.4.313-jammy.list \
          https://packages.lunarg.com/vulkan/1.4.313/lunarg-vulkan-1.4.313-jammy.list
        sudo apt-get update
        sudo apt-get install -y vulkan-sdk
        sudo pip3 install --upgrade meson
        # Same libplacebo commit Nonary v6.1.0-vrr9.1.1 ships.
        rm -rf deps/libplacebo
        git clone https://github.com/haasn/libplacebo.git deps/libplacebo
        git -C deps/libplacebo checkout 2d0979fb54e025e904c7372666fffbf5dae40f66
        git -C deps/libplacebo submodule update --init --recursive
        # Mirror Nonary: disable VK_KHR_internally_synchronized_queues — gamescope#2261
        # Game-Mode startup-crash guard on Mesa 26.1+ (harmless on older Mesa).
        git -C deps/libplacebo apply "$PWD/app/deploy/linux/appimage/libplacebo-disable-internally-synchronized-queues.patch"
        ( cd deps/libplacebo && meson setup build -Dvulkan=enabled -Dopengl=disabled -Ddemos=false && ninja -C build && sudo ninja install -C build )
        # Make the freshly-installed libplacebo the one pkg-config, the linker and
        # linuxdeploy's ldd-walk resolve (there is no apt libplacebo to shadow it).
        printf '/usr/local/lib\n/usr/local/lib/x86_64-linux-gnu\n' | sudo tee /etc/ld.so.conf.d/vibemis-local.conf
        sudo ldconfig
        echo "Bundled libplacebo: $(pkg-config --modversion libplacebo 2>/dev/null || echo '??')"

    - name: Build and install
      run: |
        export PATH="$QT_ROOT_DIR/bin:$PATH"
        # Resolve the source-built modern libplacebo (BL-2516), not any apt copy.
        export PKG_CONFIG_PATH="/usr/local/lib/x86_64-linux-gnu/pkgconfig:/usr/local/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
        export LD_LIBRARY_PATH="/usr/local/lib/x86_64-linux-gnu:/usr/local/lib:${LD_LIBRARY_PATH:-}"
        DEPLOY=$PWD/deploy
        rm -rf "$DEPLOY" build/installer-release
        mkdir -p "$DEPLOY" build/installer-release
        find . -name "Makefile*" -not -path "./.git/*" -delete 2>/dev/null || true
        rm -f .qmake.stash .qmake.cache app/.qmake.stash

        # Stamp the full semantic version (channel + timestamp + commit) into
        # version.txt so the compiled VERSION_STR identifies the exact build. Without
        # this every build reports only the base version ("1.0.1") and the in-app
        # channel-aware update checker can't tell one beta from another. CI-local only —
        # the checkout is never pushed. Linux-only job, so qmake's VERSION var is inert.
        echo "${{ needs.setup-version.outputs.version }}" > app/version.txt
        echo "Stamped app/version.txt: $(cat app/version.txt)"

        qmake6 vibemis.pro CONFIG+=release \
          CONFIG+=disable-wayland CONFIG+=disable-libdrm CONFIG+=disable-cuda \
          PREFIX=/usr DEFINES+=APP_IMAGE "QMAKE_CXXFLAGS+=-fPIC"
        make -j$(nproc)
        make INSTALL_ROOT="$DEPLOY" install

    - name: Install VAAPI apprun hook
      run: |
        DEPLOY=$PWD/deploy
        mkdir -p "$DEPLOY/apprun-hooks"
        cat > "$DEPLOY/apprun-hooks/01-libva-driver-paths.sh" << 'HOOK'
        # Vibemis AppImage — VAAPI/VDPAU host-library hook
        if [ -z "$LIBVA_DRIVERS_PATH" ]; then
            for _d in /usr/lib/x86_64-linux-gnu/dri /usr/lib64/dri /usr/lib/dri; do
                [ -d "$_d" ] && { export LIBVA_DRIVERS_PATH="$_d"; break; }
            done
        fi
        if [ -z "$VIBEMIS_SKIP_HOST_LIBVA" ]; then
            for _d in /usr/lib64 /usr/lib/x86_64-linux-gnu /usr/lib; do
                if [ -e "$_d/libva.so.2" ]; then
                    _tmp=$(mktemp -d)
                    for _so in libva.so.2 libva-drm.so.2 libva-x11.so.2; do
                        [ -e "$_d/$_so" ] && ln -sf "$_d/$_so" "$_tmp/"
                    done
                    export LD_LIBRARY_PATH="$_tmp${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
                    break
                fi
            done
        fi
        # BL-2416: FORCE_VAAPI bypasses the Gallium deprioritisation in
        # VAAPIRenderer::initialize(). That bail-out sends the session to
        # VDPAU (NOT to hevc_cuvid — the earlier comment here named the wrong
        # fallback, and a future reader would have judged the hook's safety on
        # it), and it only fires when
        #     (VAAPI major == 0) || (HAS_RFI_LATENCY_BUG=1 && !10-bit)
        # on a Gallium driver. On any modern Mesa (libva 1.x) with no opt-in
        # RFI-bug flag, that condition is structurally unreachable, so
        # exporting the override there is a no-op — device-verified on
        # Rembrandt/radeonsi/Mesa 26.1.2 (libva 1.22): stock and FORCE_VAAPI=0
        # produced an identical decode path (VAAPI renderer, hevc(vaapi), no
        # cuvid attempt, ~115 FPS both).
        #
        # So gate the export on the case it actually protects — libva 0.x —
        # instead of exporting on every launch that has host DRI drivers. Users
        # who deliberately set HAS_RFI_LATENCY_BUG=1 still hit the bail-out by
        # choice, which is the point of that opt-in. An explicit FORCE_VAAPI
        # from the environment is always honoured and never overridden here.
        if [ -z "$FORCE_VAAPI" ] && [ -n "$LIBVA_DRIVERS_PATH" ]; then
            _va_major=""
            if command -v vainfo >/dev/null 2>&1; then
                _va_major=$(vainfo 2>/dev/null | sed -n 's/.*VA-API version[: ]*\([0-9]\+\).*/\1/p' | head -1)
            fi
            if [ "$_va_major" = "0" ]; then
                export FORCE_VAAPI=1
                echo "[vibemis-apprun] FORCE_VAAPI=1 (libva 0.x on host DRI: $LIBVA_DRIVERS_PATH)" 1>&2
            else
                echo "[vibemis-apprun] FORCE_VAAPI not needed (libva major='${_va_major:-unknown}'; Gallium bail-out unreachable)" 1>&2
            fi
        fi
        if [ -z "$VDPAU_DRIVER_PATH" ]; then
            for _d in /usr/lib/x86_64-linux-gnu/vdpau /usr/lib64/vdpau /usr/lib/vdpau; do
                [ -d "$_d" ] && { export VDPAU_DRIVER_PATH="$_d"; break; }
            done
        fi
        HOOK
        chmod +x "$DEPLOY/apprun-hooks/01-libva-driver-paths.sh"

    - name: Verify branded app icon is installed
      run: |
        # The branded app icon (brand mark) is installed into the
        # hicolor theme by `make install` (app/app.pro INSTALLS icon128/256/512).
        # linuxdeploy consumes the 256px PNG as the AppImage .DirIcon via the
        # --icon-file flag below, so fail loudly here if it is missing rather
        # than shipping a generic-icon AppImage.
        DEPLOY=$PWD/deploy
        ICON="$DEPLOY/usr/share/icons/hicolor/256x256/apps/vibemis.png"
        test -f "$ICON" || { echo "ERROR: branded app icon missing at $ICON"; exit 1; }
        file "$ICON"

    - name: Bundle AppImage with linuxdeploy
      run: |
        export PATH="$QT_ROOT_DIR/bin:$PATH"
        # Tell linuxdeploy-plugin-qt where Qt 6's qmake lives
        export QMAKE="$QT_ROOT_DIR/bin/qmake6"
        # Run AppImages without FUSE (extract-and-run mode) — required in CI
        export APPIMAGE_EXTRACT_AND_RUN=1
        DEPLOY=$PWD/deploy
        VERSION=${{ needs.setup-version.outputs.version }}
        export OUTPUT="$PWD/build/installer-release/Vibemis-${VERSION}-x86_64.AppImage"
        export QML_SOURCES_PATHS=$PWD/app/gui

        linuxdeploy.AppImage \
          --appdir "$DEPLOY" \
          --executable "$DEPLOY/usr/bin/vibemis" \
          --desktop-file "$DEPLOY/usr/share/applications/com.vibemis.Vibemis.desktop" \
          --icon-file "$DEPLOY/usr/share/icons/hicolor/256x256/apps/vibemis.png" \
          --plugin qt \
          --output appimage

    - name: Verify AppImage
      run: |
        ls -lh build/installer-release/
        APP=$(ls build/installer-release/*.AppImage | head -1)
        echo "AppImage: $APP"
        md5sum "$APP"
        file "$APP"

        # BL-2266 teardown contract: the type-2 runtime execs AppRun in-place
        # and unmounts the payload the moment the AppRun process tree's last
        # holder of the keepalive fd dies. The linuxdeploy-generated AppRun
        # wrapper must therefore exec (replace itself with) the real binary —
        # a wrapper that forks-and-exits, or backgrounds the app, would let
        # the squashfs vanish under a still-running process (SIGBUS-on-quit
        # family). linuxdeploy is fetched as `continuous`, so guard the
        # contract on every build instead of trusting it.
        APPRUN="$PWD/deploy/AppRun"
        if [ -L "$APPRUN" ]; then
            echo "AppRun is a symlink (direct exec) — teardown contract OK"
        elif grep -Eq '^[[:space:]]*exec[[:space:]].*AppRun\.wrapped' "$APPRUN"; then
            echo "AppRun wrapper execs AppRun.wrapped — teardown contract OK"
        else
            echo "ERROR: AppRun wrapper no longer exec's the payload binary."
            echo "----- deploy/AppRun -----"
            cat "$APPRUN"
            exit 1
        fi

    - name: Upload AppImage artifact
      uses: actions/upload-artifact@v6
      with:
        name: vibemis-appimage-${{ needs.setup-version.outputs.version }}
        path: build/installer-release/Vibemis-${{ needs.setup-version.outputs.version }}-x86_64.AppImage
        retention-days: 90

  create-dev-release:
    name: Create Development Release
    # build-linux-dev dropped from needs — the release attaches only the
    # AppImage, and on beta/alpha tiers that job is skipped entirely now.
    # `invariants` is REQUIRED here (BL-2459): a red semantic guard must block the
    # publish, not just the merge — a dispatch/push cut doesn't go through a PR.
    # `vrr-tests` is required for the same reason: the VRR regression suite covers the
    # code path behind nearly every fix in the beta.013..beta.017 wave, and a cut that
    # publishes over a red one is exactly the soak-free ship this pipeline must prevent.
    needs: [setup-version, build-appimage-dev, invariants, vrr-tests]
    runs-on: ubuntu-latest
    permissions:
      # `contents: write` publishes the release and force-pushes the build timeline to
      # the unprotected `releases-index` branch. That is the whole list on purpose:
      # `actions: write` existed only to dispatch a validation run at the bot refresh
      # PR, and `pull-requests: write` only to open and merge that PR. Both are gone
      # with the PR dance, and dropping them means a future edit cannot quietly
      # resurrect it — the job simply has no permission to open a pull request.
      contents: write
    # dry_run=true skips this job entirely — the pipeline builds and verifies but
    # mints no release/tag. Use it for validating CI changes; cut a real version
    # only when a release is intended.
    if: >-
      github.event.inputs.dry_run != 'true' &&
      needs.setup-version.outputs.should_build == 'true' && (
        github.ref == 'refs/heads/vibemis-main' ||
        github.ref == 'refs/heads/main' ||
        github.ref == 'refs/heads/master' ||
        startsWith(github.ref, 'refs/heads/test') ||
        startsWith(github.ref, 'refs/heads/release/') ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.release_type == 'stable')
      )
    
    steps:
    - name: Checkout
      uses: actions/checkout@v5
      with:
        fetch-depth: 0  # Need full history for changelog
    
    - name: Display release version info
      run: |
        echo "Creating release with version: ${{ needs.setup-version.outputs.version }}"
        echo "Is prerelease: ${{ needs.setup-version.outputs.is_prerelease }}"

    # Tag creation is delegated to the release action (API-side). A git push of the tag
    # is REJECTED when the tagged commit touches .github/workflows/* (the GITHUB_TOKEN
    # lacks the `workflows` scope — this killed the first 0.1.0 cut, run #510); the
    # release API's implicit tag creation is not subject to that check.
    - name: Create local tag for changelog range
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git tag ${{ needs.setup-version.outputs.version }} || true

    # The release body is generated by scripts/gen-changelog.sh, NOT by shell inlined
    # here. It used to be ~100 lines in this file, which meant the only way to see what
    # a release body would say was to cut a release -- and three separate regressions
    # shipped exactly that way (raw commit subjects instead of the human notes on
    # 0.5.0-beta.004; internal CI mechanics presented as the one user-facing "Bug Fix"
    # on 0.5.0-beta.005; and a "What's new for you" section that no code ever produced,
    # so it had to be pasted onto individual releases by hand with `gh release edit`
    # and vanished again on the very next cut). As a script it runs locally and is
    # covered by scripts/check-changelog-invariants.sh, which asserts the real rendered
    # markdown against a synthetic repo -- so the format is proven BEFORE a cut.
    - name: Generate Changelog
      id: changelog
      run: |
        set -Eeuo pipefail
        bash scripts/gen-changelog.sh "${{ needs.setup-version.outputs.version }}" > changelog.md
        echo "Generated changelog:"
        cat changelog.md
        # A unique delimiter: a plain 'EOF' would terminate the heredoc early if a
        # commit message ever contained a bare EOF line.
        {
          echo 'changelog<<VIBEMIS_CHANGELOG_EOF'
          cat changelog.md
          echo VIBEMIS_CHANGELOG_EOF
        } >> $GITHUB_OUTPUT
    
    - name: Download all artifacts
      uses: actions/download-artifact@v7
      with:
        path: artifacts

    - name: Check if artifacts exist (handle build skipping scenario)
      id: check-artifacts
      run: |
        if [ -d "artifacts" ] && [ "$(ls -A artifacts)" ]; then
          echo "artifacts_exist=true" >> $GITHUB_OUTPUT
          echo "Artifacts found - proceeding with release"
        else
          echo "artifacts_exist=false" >> $GITHUB_OUTPUT
          echo "No artifacts found - builds were skipped"
          echo "Will attempt to find and link to previous build with same commit"
          
          # Try to find a previous release with the same commit hash
          COMMIT_HASH="${{ github.sha }}"
          echo "commit_hash=$COMMIT_HASH" >> $GITHUB_OUTPUT
          echo "Looking for existing artifacts with commit: $COMMIT_HASH"
        fi

    - name: Find and download previous artifacts if builds were skipped
     
      id: find-previous
      if: steps.check-artifacts.outputs.artifacts_exist == 'false'
      run: |
        echo "Searching for previous release with commit ${{ steps.check-artifacts.outputs.commit_hash }}"
        
        # Use GitHub API to find releases
        RELEASES=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          "https://api.github.com/repos/${{ github.repository }}/releases?per_page=50")
        
        # Look for a release with matching commit (in tag or body)
        MATCHING_RELEASE=$(echo "$RELEASES" | jq -r '.[] | select(.body | contains("${{ steps.check-artifacts.outputs.commit_hash }}")) | .tag_name' | head -n1)
        
        if [ -n "$MATCHING_RELEASE" ] && [ "$MATCHING_RELEASE" != "null" ]; then
          echo "Found matching release: $MATCHING_RELEASE"
          echo "previous_release_tag=$MATCHING_RELEASE" >> $GITHUB_OUTPUT
          
          # Download assets from the matching release
          mkdir -p reused-artifacts
          RELEASE_INFO=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/$MATCHING_RELEASE")
          
          # Download all assets
          echo "$RELEASE_INFO" | jq -r '.assets[].browser_download_url' | while read -r url; do
            if [ -n "$url" ]; then
              filename=$(basename "$url")
              echo "Downloading: $filename"
              curl -L -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -o "reused-artifacts/$filename" "$url"
            fi
          done
          
          echo "reused_artifacts_available=true" >> $GITHUB_OUTPUT
          ls -la reused-artifacts/
        else
          echo "No matching release found with commit ${{ steps.check-artifacts.outputs.commit_hash }}"
          echo "reused_artifacts_available=false" >> $GITHUB_OUTPUT
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: List downloaded files for debugging
      if: steps.check-artifacts.outputs.artifacts_exist == 'true'
      run: ls -R artifacts
      
    - name: List reused artifacts for debugging
      if: steps.check-artifacts.outputs.artifacts_exist == 'false'
      run: |
        if [ -d "reused-artifacts" ]; then
          echo "Reused artifacts found:"
          ls -la reused-artifacts/
        else
          echo "No reused artifacts available"
        fi
    
    - name: Create Development Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ needs.setup-version.outputs.version }}
        # Uniform titles: the tag alone carries tier + version;
        # the body's first line states the tier.
        name: Vibemis release ${{ needs.setup-version.outputs.version }}
        body: |
          ${{
            needs.setup-version.outputs.release_tier == 'release' && '✅ **Production Release**

          Verified and tested. Recommended for general use.

          📲 **Already have Vibemis installed?** No download needed — in the app open
          Settings → Advanced → **Software updates**, set the channel to **Stable**,
          then *Check for updates* → *Update now* to install this build.' ||
            needs.setup-version.outputs.release_tier == 'rc' && '🎯 **Release Candidate**

          The exact build proposed as the next stable, cut for on-device verification.

          📲 **Already have Vibemis installed?** In the app open Settings → Advanced →
          **Software updates**, set the channel to **Release candidate**, then
          *Check for updates* → *Update now* to install this build.' ||
            needs.setup-version.outputs.release_tier == 'beta' && '🧪 **Beta Build**

          Merged into `vibemis-main`. Functionally complete; broader smoke testing welcome.
          Not yet a production release.

          📲 **Already have Vibemis installed?** In the app open Settings → Advanced →
          **Software updates**, set the channel to **Beta**, then *Check for updates* →
          *Update now* to install this build.' ||
            needs.setup-version.outputs.release_tier == 'alpha' && '🔬 **Alpha Build**

          Test-cycle build from a test** branch, for targeted testing only.
          **Do not use as a daily driver.**

          📲 **Updating from a previous install:** Settings → Advanced → **Software
          updates**, channel **Alpha**, then *Check for updates* → *Update now*.' ||
            '🔧 **Dev Build** — automated build from a non-standard branch. Dev builds are
          not served by any in-app update channel — download the artifact manually.'
          }}
          
          ---
          
          ${{ steps.changelog.outputs.changelog }}
          
          ---
          
          ## 📋 Build Information
          - **Version**: `${{ needs.setup-version.outputs.version }}`
          - **Numeric Version**: `${{ needs.setup-version.outputs.numeric_version }}`
          - **Branch**: `${{ github.ref_name }}`
          - **Commit**: `${{ github.sha }}`
          - **Build**: #${{ github.run_number }}
          
          ## 🎮 Install on Steam Deck / SteamOS (no terminal needed)
          ${{ (steps.check-artifacts.outputs.artifacts_exist == 'true' || steps.find-previous.outputs.reused_artifacts_available == 'true') && '**Just want to play? Follow these three steps in Desktop Mode.**

          1. **Switch to Desktop Mode** (hold the **power button** → **Switch to Desktop**) and **download the `.AppImage`** below with the browser.
          2. **Add it to Steam:** open your file manager, find the downloaded `.AppImage` (usually in **Downloads**), **right-click it → Add to Steam**. *(No file manager “Add to Steam”? Open Steam → **Games → Add a Non-Steam Game to My Library → Browse**, and pick the `.AppImage`.)* You can rename the shortcut to **Vibemis** in its Properties.
          3. **Play from Game Mode:** switch back to Game Mode — **Vibemis** is now in your library under **Non-Steam Games**. Launch it, add your host PC, pair, and stream.

          <details><summary>Just run it once from the desktop (no Steam)</summary>

          Double-click the `.AppImage`. If nothing happens, right-click → **Properties → Permissions → Allow executing file as program** (or `chmod +x Vibemis-*.AppImage`), then double-click again. On SteamOS a FUSE error means: run `./Vibemis-*.AppImage --appimage-extract-and-run` — no install needed.
          </details>

          <details><summary>Advanced / scripted setup</summary>

          `scripts/install-vibemis-desktop.sh` installs the AppImage to a stable path with a clean **Vibemis** desktop entry ready to “Add to Steam”; `scripts/vibemis-setup.sh` chains doctor → install → pair → add-all-games. See the README.
          </details>

          > Any modern Linux desktop works the same way — download the `.AppImage`, make it executable, double-click.' || 'No installation files are available for this release. Please check recent releases or feature branches for builds.' }}
        # Ship ONLY the AppImage: one double-clickable
        # artifact per release — no tarballs/zips/raw binaries cluttering the assets list.
        files: |
          artifacts/**/*.AppImage
        # Pin the release tag to the EXACT commit this run built. Without this,
        # gh-release creates new tags on the repo DEFAULT branch — so every alpha cut from
        # a test** branch got a tag pointing at vibemis-main HEAD instead of the built
        # commit (0.2.0-alpha.001 tagged 8842ace1 while its AppImage was built from
        # f698b569). Tag provenance must identify the build's true source.
        target_commitish: ${{ github.sha }}
        prerelease: ${{ needs.setup-version.outputs.is_prerelease }}
        # The GitHub "Latest" badge points at the STABLE release only.
        # Betas stay non-prerelease (visible, not hidden) but no longer claim Latest. The
        # in-app updater and vibemis-update.sh select channels STRUCTURALLY from the full
        # release list (never /releases/latest), so update flows are unaffected.
        make_latest: ${{ needs.setup-version.outputs.release_tier == 'release' && 'true' || 'false' }}
        draft: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # Publish the chronological build timeline. GitHub's Releases page sorts by SemVer
    # precedence, so alphas always sink below betas of the same version -- this file is
    # the date-ordered "what shipped when" view the README links to.
    #
    # THIS DELIBERATELY DOES NOT OPEN A PULL REQUEST. The previous implementation
    # committed the refresh to a `ci/releases-md-refresh-<run_id>` branch, opened a bot
    # PR, dispatched a dry-run validation, waited, then tried to merge. It could never
    # work, and it left a phantom PR opening and closing after every single cut:
    #
    #   Branch protection on vibemis-main requires the contexts "AppImage Build",
    #   "Compile Sanity (Linux)" and "Invariants". GitHub suppresses pull_request
    #   events for a GITHUB_TOKEN-authored PR, so the job dispatched the checks via
    #   workflow_dispatch instead. Those runs DID complete green on the PR's exact head
    #   SHA -- and the PR's statusCheckRollup still came back EMPTY, because GitHub does
    #   not attribute workflow_dispatch check runs to the pull request. Protection
    #   therefore saw its required contexts as forever "expected", so a plain merge got
    #   "base branch policy prohibits the merge" (PRs #278, #279, #284, #285) and
    #   `--auto` simply never fired (PRs #288, #290). Widening the 120s poll window
    #   would not have helped: the merge was never going to happen at all. Every one of
    #   those six PRs was then closed by the failure path, and RELEASES.md last updated
    #   on 2026-07-22 -- six releases stale.
    #
    # A push to an ordinary branch has none of that problem. The timeline is published
    # as a single-file orphan commit force-pushed to `releases-index`, which is not
    # protected and matches no workflow trigger (see the `on:` block -- push is limited
    # to main/master/vibemis-main/test**/release/**), so it starts nothing, races
    # nothing, and needs no PAT, no admin bypass and no human follow-up. It is
    # idempotent: each cut republishes the whole timeline from the GitHub API, so a
    # skipped or failed run self-heals on the next cut instead of accumulating drift.
    - name: Publish RELEASES.md build timeline
      continue-on-error: true
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REPO: ${{ github.repository }}
        CUT_VERSION: ${{ needs.setup-version.outputs.version }}
        INDEX_BRANCH: releases-index
      run: |
        set -Eeuo pipefail
        fail_soft() {
          echo "::notice title=RELEASES.md timeline deferred::non-fatal error near line $1 - the next cut republishes the whole timeline"
          echo "- WARNING: build-timeline publish hit a non-fatal error near line $1; the next cut regenerates it" >> "$GITHUB_STEP_SUMMARY"
          exit 0
        }
        trap 'fail_soft $LINENO' ERR

        if [ ! -f scripts/gen-releases-index.sh ]; then
          echo "::notice::gen-releases-index.sh not on this branch - skipping timeline publish"
          exit 0
        fi
        bash scripts/gen-releases-index.sh "$REPO" > /tmp/RELEASES.md

        # Skip the push when nothing changed, so the branch history stays meaningful.
        # No --depth here: this checkout is a full clone (fetch-depth: 0) and a shallow
        # fetch into it would graft a shallow boundary onto the repository. The branch
        # is a single orphan commit holding one file, so a full fetch is already cheap.
        if git fetch --no-tags origin "+refs/heads/$INDEX_BRANCH:refs/remotes/origin/$INDEX_BRANCH" 2>/dev/null \
           && git cat-file -e "refs/remotes/origin/$INDEX_BRANCH:RELEASES.md" 2>/dev/null \
           && git show "refs/remotes/origin/$INDEX_BRANCH:RELEASES.md" | cmp -s - /tmp/RELEASES.md; then
          echo "Build timeline already current on $INDEX_BRANCH - nothing to publish"
          echo "- Build timeline already current" >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi

        # Build the commit with plumbing commands: an orphan (parentless) commit whose
        # tree holds exactly one file. No worktree, no checkout, and the branch never
        # accumulates the repo's history for a document that is fully regenerated each
        # time. Force-push because each cut supersedes the last snapshot.
        git config user.name  "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        BLOB=$(git hash-object -w /tmp/RELEASES.md)
        TREE=$(printf '100644 blob %s\tRELEASES.md\n' "$BLOB" | git mktree)
        COMMIT=$(git commit-tree "$TREE" -m "docs(auto): build timeline as of $CUT_VERSION")
        git push --force origin "$COMMIT:refs/heads/$INDEX_BRANCH"

        URL="https://github.com/$REPO/blob/$INDEX_BRANCH/RELEASES.md"
        echo "Build timeline published: $URL"
        echo "- [Build timeline]($URL) updated for $CUT_VERSION" >> "$GITHUB_STEP_SUMMARY"


    # ── Releases are PERMANENT, like tags ──
    # SemVer 2.0.0 §3: "Once a versioned package has been released, the contents of that
    # version MUST NOT be modified." The Releases list preserves the complete build
    # history — same behavior as the Tags page — matching the README's "complete build
    # history" promise. The former "Prune superseded releases" step (keep only the
    # newest beta/alpha; wipe the cycle on a stable cut) was removed here; do NOT
    # reintroduce release deletion without an explicit policy decision. The
    # updater is unaffected: it selects the newest release per channel structurally,
    # and only bare stables carry make_latest=true.
