# Flatpak manifest for Vibemis — Flathub app-id io.github.navyas321.Vibemis
#
# STATUS: authored, NOT yet submitted to Flathub. Submission is deferred and
# maintainer-gated (see docs/FLATHUB.md) on the public repo split + security
# audit. This file lives in the Vibemis repo as the canonical source; at
# submission time it (and the sibling files in packaging/flatpak/) are copied
# into a fork of flathub/flathub. This is packaging only — it makes no changes
# to app/ source.
#
# LINEAGE:
#   - BL-1556 authored this manifest near-verbatim from the upstream
#     Moonlight-Qt Flathub manifest (flathub/com.moonlight_stream.Moonlight).
#   - BL-2231 (this revision) supersedes that with the SteamOS packaging
#     approach from Nonary's moonlight-qt fork, commit b6c398ff ("Add Flatpak
#     packaging for SteamOS"): PREFER_VULKAN=1 baked in, RealtimeKit access,
#     libdrm ENABLED (DRM refresh-rate cross-check for the VRR pacing line,
#     BL-2212), a build-time version stamp, and the bundled Gamescope WSI
#     layer json — while DELIBERATELY DIVERGING on SDL: Nonary/upstream ship
#     SDL3 + sdl2-compat; Vibemis builds REAL SDL2 (see the SDL2 module below
#     and docs/engineering/BL-2213-audio-no-crackle-rca.md in the meta repo).
#     Target: the current beta line (0.4.0-beta.001), not a stale stable pin.
#
# Flatpak is the right vehicle for SteamOS: the rootfs is read-only (no native
# packages) and host-glibc-matched builds don't survive OS updates. It is
# ADDITIVE distribution robustness next to the AppImage, not a replacement.

app-id: io.github.navyas321.Vibemis
runtime: org.kde.Platform
runtime-version: "6.10"
sdk: org.kde.Sdk
command: vibemis
rename-icon: vibemis

# Sandbox permissions a streaming client needs. Mirrors upstream Moonlight
# plus the two Nonary/SteamOS additions called out inline.
finish-args:
  # Networking: host discovery (mDNS) + the stream itself.
  - --share=network
  - --share=ipc
  # Display: Wayland-first with an X11 fallback (works in Gamescope Game Mode).
  - --socket=wayland
  - --socket=fallback-x11
  # Audio out. PulseAudio socket only — on SteamOS/Bazzite this is served by
  # pipewire-pulse, which is exactly the battle-tested path the audio
  # invariant (BL-2213) wants vibemis on.
  - --socket=pulseaudio
  # GPU (dri), gamepads/joysticks, and other input devices. `device=all` is what
  # upstream Moonlight ships; a streaming client needs raw gamepad + /dev/dri
  # access and Flathub accepts this for the Moonlight family.
  - --device=all
  # Let the client inhibit the screensaver while streaming.
  - --talk-name=org.freedesktop.ScreenSaver
  # Ported from Nonary b6c398ff / upstream Flathub: let RtKit grant the audio
  # and decode threads realtime priority (reduces frame/audio jitter on
  # handhelds).
  - --system-talk-name=org.freedesktop.RealtimeKit1
  # Renderer / decode environment (mirrors upstream Moonlight's known-good set).
  - --env=IGNORE_RFI_LATENCY_BUG=1
  - --env=QT_QUICK_CONTROLS_STYLE=Material
  # Ported from Nonary b6c398ff: prefer the Vulkan (libplacebo) renderer by
  # default — the VRR cadence pacing being ported on the BL-2212 line lives
  # there. On today's beta the env var only deprioritizes the
  # Vulkan-incompatible VDPAU renderer (app/streaming/video/ffmpeg-renderers/
  # vdpau.cpp); it is harmless where unused. Launch with PREFER_VULKAN=0 to
  # get the stock renderer order.
  - --env=PREFER_VULKAN=1
  - --env=LIBVA_DRIVER_NAME=
  - --unset-env=LIBVA_DRIVER_NAME
  - --env=LIBVA_DRIVERS_PATH=
  - --unset-env=LIBVA_DRIVERS_PATH
  # SteamOS Game Mode: composite through the gamescope Wayland socket, and read
  # host GPU drivers (VAAPI) + the gamescope WSI layer .so that live on the
  # host OS.
  - --filesystem=xdg-run/gamescope-0
  - --filesystem=host-os:ro

cleanup:
  - /include
  - "*.a"
  - /share/ffmpeg

modules:
  # ---- Shared dependency chain (from upstream Moonlight, except SDL) --------
  - name: libplacebo
    buildsystem: meson
    build-options:
      config-opts:
        - -Ddemos=false
        - -Dvulkan=enabled
        - -Dopengl=disabled
        - -Dshaderc=enabled
    sources:
      - type: git
        url: https://github.com/haasn/libplacebo.git
        commit: d4624cbfb37fdef337a7da5794b66202671a89cd
    cleanup:
      - /include
      - /lib/pkgconfig

  - name: libdecor
    buildsystem: meson
    build-options:
      config-opts:
        - -Ddemo=false
    sources:
      - type: git
        url: https://gitlab.freedesktop.org/libdecor/libdecor.git
        tag: 0.2.2
        commit: 7807ae3480f5c6a37c5e8505d94af1e764aaf704

  # REAL SDL2 — deliberately NOT upstream Flathub's / Nonary's SDL3+sdl2-compat
  # pair, and the single intentional divergence from the Nonary b6c398ff
  # manifest this file is ported from.
  #
  # AUDIO INVARIANT (BL-2213 RCA, vibemis-agent-meta
  # docs/engineering/BL-2213-audio-no-crackle-rca.md): vibemis is the Moonlight
  # fork WITHOUT audio crackling on PipeWire handhelds precisely because it
  # ships classic SDL2, whose audio backend priority puts PulseAudio first
  # (absorbed by pipewire-pulse's deep server-side buffering). SDL3 prefers its
  # native PipeWire backend, which crackles under Moonlight's 5 ms
  # SDL_QueueAudio submission pattern (SDL#6121 — maintainer-confirmed and
  # reverted in SDL2; sdl2-compat#539; moonlight-qt#1943). The KDE runtime's
  # own libSDL2 may itself be sdl2-compat (freedesktop-sdk switched), so we
  # build real SDL2 into /app/lib, which wins over /usr/lib via the app RPATH.
  #
  # DO NOT "re-sync" this module to SDL3 + sdl2-compat on a Flathub/upstream
  # rebase. PipeWire support is left to auto-detect (NOT disabled): real SDL2
  # still orders pulse above pipewire, and keeping the backend compiled lets
  # the BL-2213 section-4 A/B experiment run via SDL_AUDIODRIVER=pipewire.
  - name: SDL2
    buildsystem: cmake-ninja
    builddir: true
    build-options:
      config-opts:
        # No raw ALSA device access inside the flatpak sandbox.
        - -DSDL_ALSA=OFF
        # THE audio path (pipewire-pulse on SteamOS/Bazzite). On by default
        # when libpulse is found; stated explicitly as documentation of the
        # invariant.
        - -DSDL_PULSEAUDIO=ON
        - -DSDL_KMSDRM=OFF
        - -DSDL_RPATH=OFF
        - -DSDL_STATIC=OFF
        - -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON
    sources:
      - type: git
        url: https://github.com/libsdl-org/SDL.git
        # Newest release on the real-SDL2 maintenance line (branch SDL2).
        tag: release-2.32.10
        commit: 5d249570393f7a37e037abf22cd6012a4cc56a71

  - name: SDL2_ttf
    buildsystem: cmake-ninja
    builddir: true
    build-options:
      config-opts:
        - -DSDL2TTF_VENDORED=ON
        - -DSDL2TTF_SAMPLES=OFF
    sources:
      - type: git
        url: https://github.com/libsdl-org/SDL_ttf.git
        # branch: SDL2 — builds against the real SDL2 module above.
        commit: a883e490e30fb44a5336ea3dcb990c6982c5216f

  - name: dav1d
    buildsystem: meson
    config-opts:
      - -Denable_tools=false
      - -Denable_tests=false
    sources:
      - type: git
        url: https://code.videolan.org/videolan/dav1d.git
        tag: 1.5.3
        commit: b546257f770768b2c88258c533da38b91a06f737

  - name: ffmpeg
    build-options:
      config-opts:
        - --fatal-warnings
        - --disable-stripping
        - --enable-pic
        - --enable-lto
        - --enable-shared
        - --disable-static
        - --disable-all
        - --enable-avcodec
        - --enable-avformat
        - --enable-swscale
        - --enable-decoder=h264
        - --enable-decoder=hevc
        - --enable-decoder=av1
        - --enable-hwaccel=h264_vaapi
        - --enable-hwaccel=hevc_vaapi
        - --enable-hwaccel=av1_vaapi
        - --enable-hwaccel=h264_vdpau
        - --enable-hwaccel=hevc_vdpau
        - --enable-hwaccel=av1_vdpau
        - --enable-libdrm
        - --enable-hwaccel=h264_vulkan
        - --enable-hwaccel=hevc_vulkan
        - --enable-hwaccel=av1_vulkan
        - --enable-decoder=h264_v4l2m2m
        - --enable-decoder=hevc_v4l2m2m
        - --enable-libdav1d
        - --enable-decoder=libdav1d
        - --enable-v4l2-request
        - --enable-hwaccel=h264_v4l2request
        - --enable-hwaccel=hevc_v4l2request
        - --enable-hwaccel=av1_v4l2request
    sources:
      - type: git
        url: https://github.com/cgutman/FFmpeg.git
        # branch: moonlight_8.1.1_r1
        commit: f116128cafb244bc0f809d0285932ced0471268d

  # Gamescope WSI Vulkan layer (SteamOS Game Mode): in gaming mode it lets
  # Vulkan present directly to gamescope instead of through XWayland. The
  # layer JSON is shipped alongside this manifest (semantics identical to
  # Nonary b6c398ff / upstream Flathub); the matching .so lives on the host
  # and is reached via --filesystem=host-os:ro above. The layer name must
  # stay VK_LAYER_FROG_gamescope_wsi_x86_64 — it has to match the host layer
  # library, so it is NOT rebranded.
  - name: gamescope-wsi
    buildsystem: simple
    build-commands:
      - install -Dm755 VkLayer_FROG_gamescope_wsi.x86_64.json /app/share/vulkan/implicit_layer.d/VkLayer_FROG_gamescope_wsi.x86_64.json
    only-arches:
      - x86_64
    sources:
      - type: file
        path: VkLayer_FROG_gamescope_wsi.x86_64.json

  # ---- Vibemis itself ------------------------------------------------------
  # Built from the top-level subdirs project (vibemis.pro → moonlight-common-c,
  # qmdnsengine, app, h264bitstream). flatpak-builder's qmake buildsystem runs
  # `qmake PREFIX=/app`, then make, then make install.
  #
  # The in-tree `make install` writes the OLD com.vibemis.Vibemis desktop +
  # appdata (whose <id> is com.vibemis.Vibemis). Because Flathub requires the
  # metainfo <id> to equal the app-id — and we deliberately make NO app/ source
  # changes here — the post-install step replaces those two files with the
  # io.github.navyas321.Vibemis desktop + metainfo shipped beside this manifest.
  # The icon has no internal id, so `rename-icon: vibemis` (top level) handles
  # renaming vibemis.png → io.github.navyas321.Vibemis.png.
  - name: vibemis
    buildsystem: qmake
    config-opts:
      - QMAKE_RPATHDIR=/app/lib
    build-options:
      config-opts:
        # Mirrors upstream Moonlight; harmless no-op if a flag is unused by the
        # Vibemis .pro (qmake ignores unrecognised CONFIG values).
        - CONFIG+=disable-cuda
        # NOTE (BL-2231, ported from Nonary b6c398ff): upstream Flathub carries
        # CONFIG+=disable-libdrm on x86_64; we deliberately DO NOT. With libdrm
        # present in the KDE SDK, app.pro auto-enables HAVE_DRM, which lets the
        # client read the TRUE display refresh rate from DRM scanout state
        # (gamescope's XWayland advertises a fake 60 Hz mode) — required by the
        # VRR pacing work on the BL-2212 line.
    post-install:
      - rm -f /app/share/applications/com.vibemis.Vibemis.desktop
      - rm -f /app/share/metainfo/com.vibemis.Vibemis.appdata.xml /app/share/metainfo/com.vibemis.Vibemis.metainfo.xml
      - install -Dm644 io.github.navyas321.Vibemis.desktop /app/share/applications/io.github.navyas321.Vibemis.desktop
      - install -Dm644 io.github.navyas321.Vibemis.metainfo.xml /app/share/metainfo/io.github.navyas321.Vibemis.metainfo.xml
    sources:
      # Pinned to the CURRENT BETA LINE (Nonary-style: ship the fork's live
      # code, stamp the version at build time), not a stale stable.
      # TODO(submission): at Flathub-submission time re-pin url+tag+commit to
      # the public repo's newest bare stable tag (docs/FLATHUB.md checklist).
      - type: git
        url: https://github.com/navyas321/vibemis.git
        tag: "0.4.0-beta.001"
        commit: b0529aed8cd344b06dfd8f573c9a0cd2103b574e
        # Full clone so the submodules (ClassicOldSong moonlight-common-c,
        # qmdnsengine, h264bitstream, SDL_GameControllerDB) resolve.
        disable-shallow-clone: true
        # Auto-update PRs in the flathub repo when a new bare stable tag lands
        # (only meaningful after submission; the stable-only pattern is
        # intentional — Flathub tracks stables, this repo pin tracks the beta).
        x-checker-data:
          type: git
          tag-pattern: ^([0-9]+\.[0-9]+\.[0-9]+)$
      # Ported from Nonary b6c398ff: stamp the precise release identity into
      # the build (in-tree app/version.txt carries only the bare 0.4.0).
      - type: shell
        commands:
          - echo 0.4.0-beta.001 > app/version.txt
      - type: file
        path: io.github.navyas321.Vibemis.desktop
      - type: file
        path: io.github.navyas321.Vibemis.metainfo.xml
